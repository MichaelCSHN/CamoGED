name: one-shot-awesome-final-review

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/awesome-special-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awesome-special-remediation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install pyyaml ruff black

      - name: Apply final review fixes
        run: python scripts/prepare_awesome_final_review.py

      - name: Format and lint
        run: |
          black scripts/build_awesome.py scripts/discover_awesome.py \
            scripts/check_awesome.py scripts/accept_awesome_candidates.py
          ruff check scripts/build_awesome.py scripts/discover_awesome.py \
            scripts/check_awesome.py scripts/accept_awesome_candidates.py

      - name: Regenerate and validate
        run: |
          python scripts/build_awesome.py
          python scripts/check_data.py
          python scripts/discover_awesome.py --self-test
          python scripts/check_awesome.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build website
        run: cd web && npm ci && npm run docs:build

      - name: Commit final review fixes
        run: |
          rm -f scripts/prepare_awesome_final_review.py
          rm -f .github/workflows/awesome-final-review.yml
          git config user.name "CamoGED Awesome Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(awesome): harden discovery and correct web links"
          git push origin HEAD:agent/awesome-special-remediation
