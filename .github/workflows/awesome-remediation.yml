name: one-shot-awesome-special-remediation

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'agent/awesome-special-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awesome-special-remediation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install pyyaml ruff black

      - name: Apply multi-axis metadata migration
        run: python scripts/apply_awesome_special_remediation.py

      - name: Format and lint maintenance scripts
        run: |
          black scripts/build_awesome.py scripts/check_awesome.py \
            scripts/discover_awesome.py scripts/accept_awesome_candidates.py
          ruff check --fix scripts/build_awesome.py scripts/check_awesome.py \
            scripts/discover_awesome.py scripts/accept_awesome_candidates.py
          black scripts/build_awesome.py scripts/check_awesome.py \
            scripts/discover_awesome.py scripts/accept_awesome_candidates.py
          ruff check scripts/build_awesome.py scripts/check_awesome.py \
            scripts/discover_awesome.py scripts/accept_awesome_candidates.py

      - name: Generate curated and catalog surfaces
        run: python scripts/build_awesome.py

      - name: Validate metadata, discovery, and acceptance criteria
        id: validate
        continue-on-error: true
        run: |
          {
            python scripts/check_data.py
            python scripts/discover_awesome.py --self-test
            python scripts/check_awesome.py
          } 2>&1 | tee awesome_validation.log
          test ${PIPESTATUS[0]} -eq 0

      - uses: actions/upload-artifact@v4
        if: steps.validate.outcome == 'failure'
        with:
          name: awesome-validation-${{ github.run_id }}
          path: awesome_validation.log
          retention-days: 7

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build website
        run: |
          cd web
          npm ci
          npm run docs:build

      - name: Commit specialist remediation
        run: |
          rm -f scripts/apply_awesome_special_remediation.py
          rm -f .github/workflows/awesome-remediation.yml
          rm -f awesome_validation.log
          git config user.name "CamoGED Awesome Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(awesome): implement curated catalog and dynamic discovery"
          git push origin HEAD:agent/awesome-special-remediation
