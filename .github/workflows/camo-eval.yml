name: camo-eval tests
on:
  push:
    paths: ["camo-eval/**"]
  pull_request:
    paths: ["camo-eval/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e "camo-eval[dev]"
      - name: Test
        run: cd camo-eval && pytest -q
