name: book

# Render portable publication formats as CI gates. PDF remains a release-format
# proofing task because it requires a pinned Chinese TeX and font environment.
on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/book.yml"]
  pull_request:
    paths: ["book/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [html, epub]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies for executable cells
        run: pip install jupyter numpy matplotlib scipy

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render book --to ${{ matrix.format }}

      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.format }}
          path: book/_book
