name: book

# Render the Quarto book (HTML) as a CI gate. The public GitHub Pages deployment
# is owned by web.yml so the website is not overwritten by book-only changes.

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Needed to EXECUTE the runnable cells in the chapters during render.
      - name: Install Python deps for code cells
        run: pip install jupyter numpy matplotlib scipy

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book (HTML only)
        run: quarto render book --to html

      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_book
