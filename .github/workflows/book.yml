name: book

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/book.yml"]
  pull_request:
    paths: ["book/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # HTML executes the teaching cells; ePub then consumes the frozen results.
    # The full monograph can exceed 30 minutes when both publication formats are proved sequentially.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install jupyter numpy matplotlib scipy
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render HTML and populate execution cache
        run: quarto render book --to html
      - name: Render ePub from frozen results
        run: quarto render book --to epub --no-execute
      - uses: actions/upload-artifact@v4
        with:
          name: book-html-epub
          path: book/_book
