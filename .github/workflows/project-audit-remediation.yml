name: one-shot-project-audit-remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: project-audit-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'agent/project-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-audit-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install project test dependencies
        run: |
          pip install pyyaml
          pip install -e 'camo-eval[dev]'
      - name: Validate metadata and public API
        run: |
          python scripts/check_data.py
          python scripts/check_api.py
          python scripts/build_awesome.py
          git diff --exit-code -- awesome/README.md web/papers.md web/datasets.md web/leaderboard.md web/models.md
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check camo-eval/src camo-eval/tests scripts/check_api.py scripts/check_data.py > ruff.log 2>&1
      - name: Persist remaining Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: |
          git config user.name 'CamoGED Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ruff.log
          git commit -m 'chore(audit): capture remaining ruff findings'
          git push origin HEAD:agent/project-audit-remediation
      - name: Stop after Ruff failure
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Black
        run: black --check camo-eval/src camo-eval/tests scripts/check_api.py scripts/check_data.py
      - name: Pytest with coverage
        run: cd camo-eval && pytest --cov=camo_eval --cov-fail-under=80 -q
      - name: Build package
        run: cd camo-eval && python -m build
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build website
        run: cd web && npm ci && npm run docs:build
