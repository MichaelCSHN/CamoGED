name: one-shot-cross-component-cleanup

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cross-component-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean:
    if: github.head_ref == 'agent/cross-component-backlog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-component-backlog
          fetch-depth: 0
      - name: Remove transient build products
        run: |
          git fetch origin agent/project-audit-remediation
          git restore --source=origin/agent/project-audit-remediation -- book/_freeze
          rm -f cross-component-validation.log
      - name: Commit cleanup
        run: |
          git config user.name "CamoGED Cross-Component Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ':!.github/workflows/**'
          git commit -m "chore(project): remove transient cross-component artifacts"
          git push origin HEAD:agent/cross-component-backlog
