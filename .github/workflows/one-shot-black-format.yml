name: one-shot-black-format

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: one-shot-black-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/project-audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-audit-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install black
      - run: black camo-eval/src camo-eval/tests scripts/check_api.py scripts/check_data.py scripts/check_assets.py scripts/check_release.py
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo 'No Black changes required.'
            exit 0
          fi
          git config user.name 'CamoGED Format Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add camo-eval/src camo-eval/tests scripts/check_api.py scripts/check_data.py scripts/check_assets.py scripts/check_release.py
          git commit -m 'style: apply Black formatting'
          git push origin HEAD:agent/project-audit-remediation
