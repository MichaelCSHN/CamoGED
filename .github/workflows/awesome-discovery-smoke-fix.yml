name: one-shot-awesome-discovery-smoke-fix

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/awesome-special-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awesome-special-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml black ruff
      - name: Apply bounded smoke changes
        run: |
          python scripts/prepare_awesome_discovery_smoke.py
          black scripts/discover_awesome.py
          ruff check scripts/discover_awesome.py
          python scripts/discover_awesome.py --self-test
          python scripts/check_awesome.py
      - name: Commit bounded smoke changes
        run: |
          rm -f scripts/prepare_awesome_discovery_smoke.py
          rm -f .github/workflows/awesome-discovery-smoke-fix.yml
          git config user.name "CamoGED Awesome Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(awesome): bound live discovery smoke queries"
          git push origin HEAD:agent/awesome-special-remediation
