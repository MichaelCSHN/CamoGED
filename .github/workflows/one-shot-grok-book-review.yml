name: one-shot Grok book review remediation

# Trigger revision 1 after workflow registration.
on:
  push:
    branches: [agent/evaluation-part-restructure]
    paths:
      - "tools/apply_grok_book_review_20260713.py"
      - ".github/workflows/one-shot-grok-book-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evaluation-part-restructure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply review changes
        run: python tools/apply_grok_book_review_20260713.py

      - name: Run targeted editorial checks
        run: |
          python -m pip install pyyaml
          python scripts/check_evaluation_part.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          index = (root / 'book/index.qmd').read_text(encoding='utf-8')
          ch1 = (root / 'book/chapters/01-essence-and-the-game.qmd').read_text(encoding='utf-8')
          appendix = (root / 'book/chapters/appendix-resources.qmd').read_text(encoding='utf-8')
          agenda = (root / 'book/chapters/appendix-research-agenda.qmd').read_text(encoding='utf-8')
          q = yaml.safe_load((root / 'book/_quarto.yml').read_text(encoding='utf-8'))

          errors = []
          for token in ['全书导航与依赖关系', 'flowchart LR', '| 21 | 前沿与责任边界']:
              if token not in index:
                  errors.append(f'index missing {token}')
          for token in ['隐真与示假', 'not\\Rightarrow', '设计手段不等于功能效果']:
              if token not in ch1:
                  errors.append(f'chapter 1 missing {token}')
          for token in ['dataset_hashes:', 'container_image_digest:', 'pollution_audit:', 'query_budget:']:
              if token not in appendix:
                  errors.append(f'appendix manifest missing {token}')
          for token in ['SQ1', 'SQ2', 'SQ3', 'SQ4', 'SQ5', 'SQ6', '伦理与预注册模板', '数据卡模板']:
              if token not in agenda:
                  errors.append(f'agenda appendix missing {token}')

          chapter_files = []
          for item in q['book']['chapters']:
              if isinstance(item, dict):
                  chapter_files.extend(item.get('chapters', []))
          for rel in chapter_files:
              text = (root / 'book' / rel).read_text(encoding='utf-8')
              if text.count('## 本章与全书映射') != 1:
                  errors.append(f'{rel}: expected one mapping card')

          if 'chapters/appendix-research-agenda.qmd' not in q['book']['appendices']:
              errors.append('research agenda appendix missing from _quarto.yml')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('Grok editorial checks: PASS')
          PY

      - name: Commit ordinary source changes
        run: |
          git config user.name "CamoGED Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add book docs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "edit(book): apply Grok structural review"
          git push origin HEAD:agent/evaluation-part-restructure
