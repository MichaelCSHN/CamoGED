name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "book/**"
      - "data/**"
      - "scripts/build_awesome.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "book/**"
      - "data/**"
      - "scripts/build_awesome.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyyaml jupyter numpy matplotlib scipy

      - name: Regenerate markdown surfaces
        run: python scripts/build_awesome.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install
        working-directory: web

      - name: Build VitePress site
        run: npm run docs:build
        working-directory: web

      - name: Render book into website artifact
        run: |
          quarto render book --to html
          mkdir -p web/.vitepress/dist/book
          cp -R book/_book/. web/.vitepress/dist/book/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vitepress/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
