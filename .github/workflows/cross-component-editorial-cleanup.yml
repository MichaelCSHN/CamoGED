name: one-shot-cross-component-editorial-cleanup

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cross-component-editorial-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean:
    if: github.head_ref == 'agent/cross-component-backlog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-component-backlog
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair callout and soften dynamic claims
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          ch14_path = root / 'book/chapters/14-foundation-models.qmd'
          text = ch14_path.read_text(encoding='utf-8')
          front_end = text.find('\n---\n', text.find('---') + 3)
          if front_end < 0:
              raise SystemExit('chapter 14 front matter not found')
          guide_start = text.find('## 本章导读', front_end)
          guide_end = text.find('\n:::\n', guide_start)
          if guide_start < 0 or guide_end < 0:
              raise SystemExit('chapter 14 guide block not found')
          guide_body = text[guide_start:guide_end]
          rest = text[guide_end + len('\n:::\n'):]
          note = (
              '::: {.callout-note}\n'
              '本章前沿文献快照核验至 **2026-07-13**。Research Catalog 负责持续发现候选；'
              '只有正文实际采用且经一手来源复核的工作才进入本章与 `references.bib`。\n'
              ':::'
          )
          text = (
              text[:front_end + len('\n---\n')].rstrip()
              + '\n\n::: {.callout-tip}\n'
              + guide_body.rstrip()
              + '\n:::\n\n'
              + note
              + '\n\n'
              + rest.lstrip()
          )
          ch14_path.write_text(text.rstrip() + '\n', encoding='utf-8')

          ch10_path = root / 'book/chapters/10-intelligent-overview-datasets.qmd'
          text = ch10_path.read_text(encoding='utf-8')
          replacements = {
              '这一协议已成为事实标准': '这一组合已成为常见对比协议',
              '本平台的排行榜（`data/leaderboard.yaml`）对每条结果**逐一标注训练协议、骨干网络与数据来源**，区分"原文报告"与"本平台复现"，以保证可比性。':
                  'CamoGED 的结果登记表要求每条记录注明任务协议、指标实现、来源与核验状态；骨干、预训练和额外数据若未在源记录中明确，就不应据此作直接比较。',
              '是目前质量与规模平衡最好的可用组合': '在许多图像 COD 论文中作为常用基线组合',
              '首批全标注 COD，含遮挡': '早期全标注 COD，含遮挡',
              '最常用视频基准': '常用视频基准',
              '是目前标注质量最高的图像 COD 基准之一': '采用了较为系统的多轮标注与交叉核验流程',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'chapter 10 phrase not found: {old}')
              text = text.replace(old, new)
          ch10_path.write_text(text.rstrip() + '\n', encoding='utf-8')

          check_path = root / 'scripts/check_cross_component.py'
          check = check_path.read_text(encoding='utf-8')
          old = '    for forbidden in ("当前最大图像基准", "跨数据集泛化评测标准"):\n'
          new = '''    for forbidden in (\n        "当前最大图像基准",\n        "跨数据集泛化评测标准",\n        "事实标准",\n        "质量与规模平衡最好的",\n        "首批全标注 COD",\n        "最常用视频基准",\n        "目前标注质量最高",\n    ):\n'''
          if old not in check:
              raise SystemExit('cross-component chapter 10 forbidden marker not found')
          check = check.replace(old, new, 1)
          marker = '    chapter14_tokens = (\n'
          syntax_check = '''    if "::: {.callout-tip}\\n## 本章导读" not in chapter14:\n        errors.append("chapter 14 guide callout is malformed")\n    if chapter14.count("::: {.callout-note}") < 1:\n        errors.append("chapter 14 snapshot callout is missing")\n\n'''
          if syntax_check not in check:
              check = check.replace(marker, syntax_check + marker, 1)
          check_path.write_text(check.rstrip() + '\n', encoding='utf-8')
          PY
          pip install black ruff
          black scripts/check_cross_component.py
          ruff check scripts/check_cross_component.py
          python scripts/check_cross_component.py
      - name: Commit editorial cleanup
        run: |
          git config user.name "CamoGED Cross-Component Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add book/chapters/10-intelligent-overview-datasets.qmd \
            book/chapters/14-foundation-models.qmd scripts/check_cross_component.py
          git commit -m "fix(book): repair callout and soften dynamic claims"
          git push origin HEAD:agent/cross-component-backlog
