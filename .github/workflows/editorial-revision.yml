name: one-shot-book-editorial-revision

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: book-editorial-revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  revise:
    if: github.head_ref == 'agent/book-editorial-revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/book-editorial-revision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether revision is already applied
        id: state
        shell: bash
        run: |
          if grep -q 'title: "伪装：生成、识别与评价"' book/_quarto.yml; then
            echo "needs=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize exact match points
        if: steps.state.outputs.needs == 'true'
        run: python scripts/prepare_book_editorial_revision.py

      - name: Apply editorial revision
        if: steps.state.outputs.needs == 'true'
        id: apply
        continue-on-error: true
        run: python scripts/apply_book_editorial_revision.py > editorial_run.log 2>&1

      - name: Stop after failed rewrite
        if: steps.state.outputs.needs == 'true' && steps.apply.outcome == 'failure'
        run: |
          cat editorial_run.log
          exit 1

      - name: Validate scripts and editorial invariants
        run: |
          python -m py_compile scripts/apply_book_editorial_revision.py
          ! grep -R "原创项目占位说明" book/chapters
          ! grep -R "数值全部留空待核实" book/chapters
          ! grep -R '^继续。$' book/chapters
          grep -q '第三篇　识别：揭示方如何反制' book/_quarto.yml
          grep -q '## G　图像版权与版本清单' book/chapters/appendix-resources.qmd

      - name: Install executable-cell dependencies
        run: pip install jupyter numpy matplotlib scipy

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML proof
        run: quarto render book --to html

      - name: Commit generated editorial source changes
        if: steps.state.outputs.needs == 'true'
        run: |
          rm -rf book/_book editorial_run.log
          git config user.name "CamoGED Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CITATION.cff \
            book/_quarto.yml book/index.qmd book/chapters book/EDITORIAL_CHANGELOG.md \
            docs/BOOK_COMPILATION_PLAN.md docs/BOOK_STYLE_GUIDE.md \
            docs/BOOK_SEARCH_METHODOLOGY.md docs/BOOK_FACTCHECK_REGISTER.md \
            scripts/apply_book_editorial_revision.py scripts/prepare_book_editorial_revision.py
          git diff --cached --quiet && exit 0
          git commit -m "book: implement publication-grade editorial revision"
          git push origin HEAD:agent/book-editorial-revision
