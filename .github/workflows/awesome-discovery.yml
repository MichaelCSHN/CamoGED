name: awesome candidate discovery

on:
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:
    inputs:
      max_results:
        description: "Maximum candidates retrieved per configured query"
        required: false
        default: "15"
      min_year:
        description: "Ignore records older than this year"
        required: false
        default: "2024"

concurrency:
  group: awesome-discovery
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install discovery dependency
        run: pip install pyyaml

      - name: Self-test parser and deduplication
        run: python scripts/discover_awesome.py --self-test

      - name: Discover candidates
        env:
          MAX_RESULTS: ${{ inputs.max_results || '15' }}
          MIN_YEAR: ${{ inputs.min_year || '2024' }}
        run: |
          python scripts/discover_awesome.py \
            --max-results "$MAX_RESULTS" \
            --min-year "$MIN_YEAR" \
            --output-json awesome_candidates.json \
            --output-markdown awesome_candidates.md

      - uses: actions/upload-artifact@v4
        with:
          name: awesome-candidates-${{ github.run_id }}
          path: |
            awesome_candidates.json
            awesome_candidates.md
          retention-days: 90

      - name: Create candidate triage issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('awesome_candidates.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const labelName = 'awesome:triage';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '6f42c1',
                description: 'Automated discovery candidates requiring human Awesome review',
              });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Awesome candidate triage — ${date} — run ${context.runId}`,
              body,
              labels: [labelName],
            });
