name: one-shot-cross-component-final-claims

on:
  pull_request:
    branches: [agent/project-audit-remediation]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cross-component-final-claims-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean:
    if: github.head_ref == 'agent/cross-component-backlog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-component-backlog
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove residual unsupported claims
        run: |
          python - <<'PY'
          from pathlib import Path

          ch10_path = Path('book/chapters/10-intelligent-overview-datasets.qmd')
          ch10 = ch10_path.read_text(encoding='utf-8')
          replacements = {
              '三个测试集来源不同，难度各异，综合评测更全面；（3）NC4K 的"仅测试"保证了跨分布评测的干净性':
                  '三个测试集来源和难度存在差异；（3）NC4K 不参与训练，可减少直接训练泄漏，但并不自动构成严格的分布外评测',
              '本平台要求方法提交时申报骨干预训练来源，并建议使用不与 COD 数据集来源重叠的预训练集（如 ImageNet-22K 而非 COCO 预训练）。':
                  '规范报告应申报骨干预训练来源；是否存在与 COD 测试样本或其来源的重叠，需要通过数据溯源审计判断，不能仅凭预训练数据集名称推断。',
              '图像 COD 的四个事实标准指标为：': '图像 COD 常用的四个核心指标为：',
          }
          for old, new in replacements.items():
              if old in ch10:
                  ch10 = ch10.replace(old, new)
                  print(f'replaced chapter 10: {old}')
              elif new in ch10:
                  print(f'already replaced chapter 10: {new}')
              else:
                  print(f'chapter 10 marker absent: {old}')
          ch10_path.write_text(ch10.rstrip() + '\n', encoding='utf-8')

          ch14_path = Path('book/chapters/14-foundation-models.qmd')
          ch14 = ch14_path.read_text(encoding='utf-8')
          replacements = {
              '**基础模型**（在数以亿计的图文对或自然图像上预训练）提供了一个已经理解了"自然图像的大量视觉规律"的特征空间。':
                  '**基础模型**通常在大规模图像或图文语料上预训练，因而提供了覆盖较广的视觉或语义特征空间。',
              '这带来两点直接好处：参数效率极高（适配模块只有几 M 参数，而不需要重新训练数亿参数的骨干）；以及对有限标注数据更友好的过拟合风险。':
                  '这可能减少可训练参数并缓解小样本适配成本，但具体参数比例、稳定性和过拟合收益必须由消融与跨数据集实验报告。',
              '基础模型的训练数据中，刻意隐藏的伪装目标几乎不存在——自然图像数据集里的目标普遍是"显著的"。':
                  '公开预训练语料通常没有系统标注伪装目标，其实际覆盖率也难以核查；常规对象数据又往往偏向可辨识目标。',
              '**双流适配器**（Dual-Stream Adapters）是目前最系统的 SAM-COD 适配之一':
                  '**双流适配器**（Dual-Stream Adapters）提供了一个明确的 SAM-COD 适配实例',
              '适配器的参数量通常只有主干的 1–5%，大幅降低了标注需求。':
                  '适配器可以减少可训练参数，但参数效率并不等于降低标注需求，二者应分别报告。',
              '这样做比全量微调更稳定，也更适合小数据集。':
                  '这样做可能比全量微调更易控制训练成本，也常被用于小数据集；稳定性仍取决于适配位置、数据和优化设置。',
          }
          for old, new in replacements.items():
              if old in ch14:
                  ch14 = ch14.replace(old, new)
                  print(f'replaced chapter 14: {old}')
              elif new in ch14:
                  print(f'already replaced chapter 14: {new}')
              else:
                  print(f'chapter 14 marker absent: {old}')
          ch14_path.write_text(ch14.rstrip() + '\n', encoding='utf-8')

          check_path = Path('scripts/check_cross_component.py')
          check = check_path.read_text(encoding='utf-8')
          marker = '        "目前标注质量最高",\n'
          additions = (
              '        "四个事实标准指标",\n'
              '        "保证了跨分布评测的干净性",\n'
          )
          if additions not in check and marker in check:
              check = check.replace(marker, marker + additions, 1)
          marker14 = '    for forbidden in ("性能保留率，普遍高于", "普遍高于使用专有 CNN"):\n'
          replacement14 = '''    for forbidden in (\n        "性能保留率，普遍高于",\n        "普遍高于使用专有 CNN",\n        "参数效率极高",\n        "刻意隐藏的伪装目标几乎不存在",\n        "目前最系统的 SAM-COD",\n        "通常只有主干的 1–5%",\n    ):\n'''
          if marker14 in check:
              check = check.replace(marker14, replacement14, 1)
          check_path.write_text(check.rstrip() + '\n', encoding='utf-8')
          PY
          pip install black ruff pyyaml
          black scripts/check_cross_component.py
          ruff check scripts/check_cross_component.py
          python scripts/build_awesome.py
      - name: Validate final evidence claims
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_cross_component.py 2>&1 | tee claim-cleanup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-component-claim-cleanup-${{ github.run_id }}
          path: claim-cleanup.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop after claim validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1
      - name: Commit final claim cleanup
        run: |
          rm -f claim-cleanup.log
          git config user.name "CamoGED Cross-Component Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add book/chapters/10-intelligent-overview-datasets.qmd \
            book/chapters/14-foundation-models.qmd scripts/check_cross_component.py
          git commit -m "fix(book): align dynamic claims with evidence"
          git push origin HEAD:agent/cross-component-backlog
