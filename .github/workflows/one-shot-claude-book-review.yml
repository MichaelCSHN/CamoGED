name: one-shot Claude book review remediation

on:
  push:
    branches: [agent/evaluation-part-restructure]
    paths:
      - "tools/apply_claude_book_review_20260713.py"
      - ".github/workflows/one-shot-claude-book-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evaluation-part-restructure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply review fixes
        run: python tools/apply_claude_book_review_20260713.py

      - name: Run targeted gates
        run: |
          python -m pip install pyyaml
          python scripts/check_evaluation_part.py
          python - <<'PY'
          from pathlib import Path
          checks = {
              "book/chapters/06-physical-adversarial.qmd": ["这也是本章的最终落点。"],
              "book/chapters/09-physical-digital-detection.qmd": ["从此开始，搜索者登场。"],
              "book/chapters/11-image-cod.qmd": ["prohibition"],
              "book/chapters/02-natural-camouflage.qmd": ["[@sec-pattern-design]", "[@sec-protocol]"],
          }
          errors = []
          for name, forbidden in checks.items():
              text = Path(name).read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      errors.append(f"{name}: forbidden token remains: {token}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Claude review targeted checks: PASS")
          PY

      - name: Commit ordinary source changes
        run: |
          git config user.name "CamoGED Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add book docs/BOOK_REVIEW_RESPONSE_20260713.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(book): apply Claude editorial review findings"
          git push origin HEAD:agent/evaluation-part-restructure
