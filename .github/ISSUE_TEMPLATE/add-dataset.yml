name: Add a dataset
description: Propose a dataset for the registry.
labels: ["resource:dataset"]
body:
  - type: input
    id: name
    attributes:
      label: Dataset name
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size / splits
  - type: dropdown
    id: modality
    attributes:
      label: Modality
      options:
        - rgb
        - rgb-video
        - multispectral
        - multimodal
        - other
  - type: input
    id: link
    attributes:
      label: Official link
