# CamoGED — datasets registry (single source of truth)
# Consumed by both awesome/README.md and the website /datasets page.
# Add new datasets here. Fields marked TODO need verification before release.

datasets:
  - name: CHAMELEON
    task: image-cod
    modality: rgb
    size: "76 images"
    split: "test-only"
    note: "Early small-scale set; often dropped due to bias"
    link: null
    cite: null

  - name: CAMO
    task: image-cod
    modality: rgb
    size: "1,250 camouflaged (+1,250 non-camouflaged)"
    split: "1,000 train / 250 test"
    note: "First fully annotated COD dataset"
    link: null
    cite: "Le et al., 2019"

  - name: COD10K
    task: image-cod
    modality: rgb
    size: "5,066 camouflaged (~10K total)"
    split: "3,040 train / 2,026 test; 78 sub-classes"
    note: "Largest image COD benchmark"
    link: null
    cite: "Fan et al., 2020/2022"

  - name: NC4K
    task: image-cod
    modality: rgb
    size: "4,121 images"
    split: "test-only (generalization)"
    note: "Includes ranking annotations"
    link: null
    cite: "Lv et al., 2021"

