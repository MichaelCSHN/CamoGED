<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Source Han Sans SC','Noto Sans CJK SC','Inter',sans-serif">
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2f36">伪装评价的统一标尺</text>
  <text x="460" y="50" text-anchor="middle" font-size="12.5" fill="#6b7280">A unified yardstick: judging the hide ⇄ seek game</text>

  <!-- Judge node -->
  <rect x="370" y="70" width="180" height="48" rx="12" fill="#e6e8eb" stroke="#5B6470" stroke-width="2"/>
  <text x="460" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#3f4651">评价 · 裁判</text>
  <text x="460" y="109" text-anchor="middle" font-size="11" fill="#5B6470">Evaluation (the judge)</text>

  <!-- four pillars -->
  <!-- detection (seeker side, terracotta) -->
  <g>
    <rect x="40" y="170" width="200" height="250" rx="12" fill="#fbf1ec" stroke="#B6542E" stroke-width="1.6"/>
    <text x="140" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8f3f20">识别质量</text>
    <text x="140" y="212" text-anchor="middle" font-size="10.5" fill="#a05636">detection quality</text>
    <text x="140" y="240" text-anchor="middle" font-size="11.5" fill="#5b4034">MAE ↓</text>
    <text x="140" y="262" text-anchor="middle" font-size="11.5" fill="#5b4034">加权 F-measure ↑</text>
    <text x="140" y="284" text-anchor="middle" font-size="11.5" fill="#5b4034">S-measure ↑</text>
    <text x="140" y="306" text-anchor="middle" font-size="11.5" fill="#5b4034">E-measure ↑</text>
    <text x="140" y="328" text-anchor="middle" font-size="11.5" fill="#5b4034">实例 AP / AR</text>
    <text x="140" y="350" text-anchor="middle" font-size="11.5" fill="#5b4034">视频时序一致性</text>
  </g>
  <!-- generation (hider side, teal) -->
  <g>
    <rect x="260" y="170" width="200" height="250" rx="12" fill="#e9f3f0" stroke="#2E8B7A" stroke-width="1.6"/>
    <text x="360" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6b5c">生成质量</text>
    <text x="360" y="212" text-anchor="middle" font-size="10.5" fill="#3f7a6e">generation quality</text>
    <text x="360" y="240" text-anchor="middle" font-size="11.5" fill="#27524a">FID ↓ / LPIPS ↓</text>
    <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#27524a">用户研究</text>
    <text x="360" y="284" text-anchor="middle" font-size="11.5" fill="#27524a">欺骗率 ↑</text>
    <text x="360" y="306" text-anchor="middle" font-size="11.5" fill="#27524a">（对检测器）</text>
    <text x="360" y="328" text-anchor="middle" font-size="11.5" fill="#27524a">隐蔽性—攻击性</text>
    <text x="360" y="350" text-anchor="middle" font-size="11.5" fill="#27524a">权衡曲线</text>
  </g>
  <!-- robustness (slate) -->
  <g>
    <rect x="480" y="170" width="200" height="250" rx="12" fill="#eef0f2" stroke="#5B6470" stroke-width="1.6"/>
    <text x="580" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3f4651">对抗鲁棒性</text>
    <text x="580" y="212" text-anchor="middle" font-size="10.5" fill="#5B6470">robustness</text>
    <text x="580" y="240" text-anchor="middle" font-size="11.5" fill="#3f4651">攻击成功率</text>
    <text x="580" y="262" text-anchor="middle" font-size="11.5" fill="#3f4651">AP 下降</text>
    <text x="580" y="284" text-anchor="middle" font-size="11.5" fill="#3f4651">跨模型迁移性</text>
    <text x="580" y="306" text-anchor="middle" font-size="11.5" fill="#3f4651">物理可实现性</text>
    <text x="580" y="328" text-anchor="middle" font-size="11.5" fill="#3f4651">多视角/光照</text>
  </g>
  <!-- human/cross-domain -->
  <g>
    <rect x="700" y="170" width="200" height="250" rx="12" fill="#f6f7f8" stroke="#9aa0a8" stroke-width="1.6"/>
    <text x="800" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3f4651">跨域 / 人因</text>
    <text x="800" y="212" text-anchor="middle" font-size="10.5" fill="#7a818b">cross-domain / human</text>
    <text x="800" y="240" text-anchor="middle" font-size="11.5" fill="#4a515a">知觉搜索实验</text>
    <text x="800" y="262" text-anchor="middle" font-size="11.5" fill="#4a515a">反应时 / 命中率</text>
    <text x="800" y="284" text-anchor="middle" font-size="11.5" fill="#4a515a">与生物/军事</text>
    <text x="800" y="306" text-anchor="middle" font-size="11.5" fill="#4a515a">口径对照</text>
    <text x="800" y="338" text-anchor="middle" font-size="10.5" fill="#9aa0a8">⚠ 避免：泄漏 /</text>
    <text x="800" y="354" text-anchor="middle" font-size="10.5" fill="#9aa0a8">指标博弈 / 不可比</text>
  </g>

  <!-- connectors -->
  <line x1="430" y1="118" x2="140" y2="170" stroke="#cdd1d6" stroke-width="1.4"/>
  <line x1="445" y1="118" x2="360" y2="170" stroke="#cdd1d6" stroke-width="1.4"/>
  <line x1="475" y1="118" x2="580" y2="170" stroke="#cdd1d6" stroke-width="1.4"/>
  <line x1="490" y1="118" x2="800" y2="170" stroke="#cdd1d6" stroke-width="1.4"/>

  <text x="460" y="448" text-anchor="middle" font-size="11.5" fill="#6b7280">统一实现于 camo-eval：可复现、可生成论文表格</text>
</svg>
