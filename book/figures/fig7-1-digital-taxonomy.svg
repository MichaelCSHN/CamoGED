<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'Source Han Sans SC','Noto Sans CJK SC','Inter',sans-serif">
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2f36">数字域三类伪装的博弈坐标</text>

  <!-- Column headers -->
  <text x="155" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6470">隐写</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6470">深度伪造</text>
  <text x="705" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6470">语义数字对抗</text>

  <!-- Three main boxes -->
  <rect x="20" y="60" width="270" height="240" rx="12" fill="#e9f3f0" stroke="#2E8B7A" stroke-width="1.5"/>
  <rect x="295" y="60" width="270" height="240" rx="12" fill="#f7f8f9" stroke="#9aa0a8" stroke-width="1.5"/>
  <rect x="570" y="60" width="270" height="240" rx="12" fill="#fbf1ec" stroke="#B6542E" stroke-width="1.5"/>

  <!-- Steganography box content -->
  <text x="155" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f6b5c">隐写（Steganography）</text>
  <line x1="40" y1="98" x2="270" y2="98" stroke="#2E8B7A" stroke-width="0.8" opacity="0.4"/>
  <text x="155" y="118" text-anchor="middle" font-size="11" fill="#3f4651">隐藏对象：比特/信息</text>
  <text x="155" y="137" text-anchor="middle" font-size="11" fill="#3f4651">信道 C：载体图像统计分布</text>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#3f4651">揭示方：隐写分析算法</text>
  <text x="155" y="176" text-anchor="middle" font-size="11" fill="#3f4651">成功标准：第三方察觉不到</text>
  <line x1="40" y1="190" x2="270" y2="190" stroke="#2E8B7A" stroke-width="0.8" opacity="0.3"/>
  <text x="155" y="208" text-anchor="middle" font-size="11" fill="#1f6b5c">代表方法</text>
  <text x="155" y="225" text-anchor="middle" font-size="10.5" fill="#3f7a6e">LSB / DCT / HiDDeN</text>
  <text x="155" y="244" text-anchor="middle" font-size="10.5" fill="#3f7a6e">（编码器-解码器-判别器）</text>
  <text x="155" y="268" text-anchor="middle" font-size="10" fill="#6b7280">评价：容量-不可辨性曲线</text>
  <text x="155" y="285" text-anchor="middle" font-size="10" fill="#6b7280">检测 AUC → ch15 §15.3</text>

  <!-- Deepfake box content -->
  <text x="430" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3f4651">深度伪造（Deepfake）</text>
  <line x1="315" y1="98" x2="545" y2="98" stroke="#9aa0a8" stroke-width="0.8" opacity="0.4"/>
  <text x="430" y="118" text-anchor="middle" font-size="11" fill="#3f4651">隐藏对象：来源/身份/真实性</text>
  <text x="430" y="137" text-anchor="middle" font-size="11" fill="#3f4651">信道 C：视觉/听觉身份信号</text>
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#3f4651">揭示方：人眼 + 取证算法</text>
  <text x="430" y="176" text-anchor="middle" font-size="11" fill="#3f4651">成功标准：被误认为真实</text>
  <line x1="315" y1="190" x2="545" y2="190" stroke="#9aa0a8" stroke-width="0.8" opacity="0.3"/>
  <text x="430" y="208" text-anchor="middle" font-size="11" fill="#3f4651">代表方法</text>
  <text x="430" y="225" text-anchor="middle" font-size="10.5" fill="#5B6470">Autoencoder / GAN / Diffusion</text>
  <text x="430" y="244" text-anchor="middle" font-size="10.5" fill="#5B6470">（FaceSwap / 面孔重演）</text>
  <text x="430" y="268" text-anchor="middle" font-size="10" fill="#6b7280">评价：FID / 跨生成器泛化</text>
  <text x="430" y="285" text-anchor="middle" font-size="10" fill="#6b7280">FaceForensics++ → ch15 §15.2</text>

  <!-- Adversarial box content -->
  <text x="705" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8f3f20">语义数字对抗</text>
  <line x1="590" y1="98" x2="820" y2="98" stroke="#B6542E" stroke-width="0.8" opacity="0.4"/>
  <text x="705" y="118" text-anchor="middle" font-size="11" fill="#3f4651">隐藏对象：误导意图/扰动</text>
  <text x="705" y="137" text-anchor="middle" font-size="11" fill="#3f4651">信道 C：模型决策特征空间</text>
  <text x="705" y="156" text-anchor="middle" font-size="11" fill="#3f4651">揭示方：目标分类/检测模型</text>
  <text x="705" y="176" text-anchor="middle" font-size="11" fill="#3f4651">成功标准：目标模型被误判</text>
  <line x1="590" y1="190" x2="820" y2="190" stroke="#B6542E" stroke-width="0.8" opacity="0.3"/>
  <text x="705" y="208" text-anchor="middle" font-size="11" fill="#8f3f20">代表方法</text>
  <text x="705" y="225" text-anchor="middle" font-size="10.5" fill="#a05636">AdvCam / 扩散对抗 / 无限制AE</text>
  <text x="705" y="244" text-anchor="middle" font-size="10.5" fill="#a05636">（神经风格迁移隐蔽化）</text>
  <text x="705" y="268" text-anchor="middle" font-size="10" fill="#6b7280">评价：AP↓ / LPIPS / ASR</text>
  <text x="705" y="285" text-anchor="middle" font-size="10" fill="#6b7280">camo-eval metrics/robustness</text>

  <!-- Bottom shared annotation -->
  <text x="430" y="318" text-anchor="middle" font-size="11" fill="#9aa0a8">← 三者共享"使揭示方犯错"的目标，各自攻击信道 C 的不同层次 →</text>
</svg>
